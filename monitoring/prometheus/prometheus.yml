# Prometheus — LOCAL Docker Compose targets (container DNS names).
# The AWS version with private IPs is prometheus.aws.yml.
#
# Pull model: Prometheus scrapes each target's /metrics every scrape_interval. A target
# that stops answering becomes `up == 0` — the absence of data is itself a signal.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api-1:8000"]
        labels: { instance_name: api-1 }
      - targets: ["api-2:8000"]
        labels: { instance_name: api-2 }
      - targets: ["api-3:8000"]
        labels: { instance_name: api-3 }

  - job_name: worker
    static_configs:
      - targets: ["worker-1:9101"]
        labels: { instance_name: worker-1 }
      - targets: ["worker-2:9101"]
        labels: { instance_name: worker-2 }

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  # Per-queue depth (messages ready / unacked per queue).
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: { instance_name: docker-host }

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
