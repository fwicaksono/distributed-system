# Local upstream set: 2 API server(s). Switched by scripts/scale-experiment.sh
# max_fails/fail_timeout = passive health check: after 3 failures within 10s the server
# is taken out of rotation for 10s, then tried again.
server api-1:8000 resolve max_fails=3 fail_timeout=10s;
server api-2:8000 resolve max_fails=3 fail_timeout=10s;
