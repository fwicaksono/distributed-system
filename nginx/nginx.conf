# Main Nginx configuration shared by local Docker Compose and the AWS edge node.
# Site-specific config (upstreams, TLS) lives in conf.d/ and templates/.

user  nginx;
# One worker process per CPU core. Nginx is event-driven: each worker multiplexes
# thousands of connections with epoll, so more processes than cores only adds switching.
worker_processes  auto;
# Raise the per-process file descriptor limit: every connection = 1 fd (2 when proxying).
worker_rlimit_nofile 65535;

error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    # Max simultaneous connections PER worker (client + upstream connections both count).
    worker_connections  8192;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured access log. request_id ties this line to the API and worker logs;
    # upstream_addr shows WHICH API server handled the request (load-balancing proof).
    log_format json escape=json '{'
        '"ts":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"'
    '}';
    access_log /dev/stdout json;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;          # don't advertise the Nginx version

    # Client-side timeouts: protect workers from slow clients (slowloris-style attacks).
    keepalive_timeout      65s;
    client_header_timeout  10s;
    client_body_timeout    10s;
    send_timeout           30s;
    client_max_body_size   1m;    # our API only accepts small JSON bodies

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript;

    # Coarse edge rate limit (per client IP) BEFORE requests reach Python. The API has its
    # own Redis-backed, per-user limiter; this one is a cheap shield against floods.
    limit_req_zone  $binary_remote_addr zone=per_ip:10m rate=50r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # Map for WebSocket-safe Connection header handling with upstream keepalive.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    include /etc/nginx/conf.d/*.conf;
}
