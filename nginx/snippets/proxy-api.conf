# Reverse-proxy settings for the FastAPI upstream. Included by every site config.

proxy_pass http://api_backend;

# HTTP/1.1 + empty Connection header are REQUIRED for upstream keepalive to work.
proxy_http_version 1.1;
proxy_set_header Connection "";

# Tell the API who the real client is. Without these, every request appears to come from
# Nginx's IP — rate limiting per IP and audit logs would be useless.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID      $request_id;

# Timeouts to the upstream.
proxy_connect_timeout 3s;   # TCP connect to API. Fail fast: a dead server should not cost 60s.
proxy_send_timeout    30s;  # max gap between two writes of the request to the API
proxy_read_timeout    30s;  # max gap between two reads of the response (NOT total time)

# Passive failover: if an API server refuses/times out/returns 502/503/504, retry the
# request on the NEXT server. By default Nginx never retries non-idempotent requests
# (POST) once they were sent — a retried POST could create a task twice.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 10s;

# Buffering: Nginx reads the whole upstream response into memory quickly, freeing the
# Python process, then trickles it to slow clients itself.
proxy_buffering on;
proxy_buffer_size 16k;
proxy_buffers 8 16k;

limit_req  zone=per_ip burst=100 nodelay;
limit_conn conn_per_ip 50;
