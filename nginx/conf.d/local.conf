# Local Docker Compose site: HTTP only, APIs addressed by container name.

# Docker's embedded DNS. `valid=10s` re-resolves container IPs, so a restarted API
# container (new IP) is picked up without restarting Nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_backend {
    # Shared memory zone: required for `resolve`, and lets all Nginx workers share
    # the up/down state of each server.
    zone api_backend 64k;

    # Default algorithm is round robin. Alternatives:
    #   least_conn;   -> send to the server with fewest active connections (uneven latency)
    #   hash $x consistent; / ip_hash; -> sticky routing (avoid: our APIs are stateless)
    include /etc/nginx/upstreams/active.conf;

    # Idle keepalive connections to upstreams, per worker. Saves a TCP handshake per request.
    keepalive 32;
    keepalive_timeout 60s;
}

server {
    listen 80 default_server;
    server_name _;

    location /api/ {
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location /health/ {
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location = /docs          { include /etc/nginx/snippets/proxy-api.conf; }
    location = /openapi.json  { include /etc/nginx/snippets/proxy-api.conf; }

    # Nginx's own liveness, independent of the APIs (used by the container healthcheck).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Connection counters for debugging (`curl localhost:8080/nginx-status` from inside).
    location = /nginx-status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
    }

    # Metrics are scraped by Prometheus over the private network — never via the proxy.
    location = /metrics { return 404; }

    location / { return 404; }
}
