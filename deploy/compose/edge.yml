# EDGE node (public subnet, Elastic IP): Nginx (TLS + load balancer) and api-1.
# The only instance reachable from the internet, and only on 80/443.

name: taskplatform

services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"      # public: ACME challenge + redirect
      - "443:443"    # public: HTTPS
    environment:
      DOMAIN: ${DOMAIN:?}
      API_1_ADDR: api-1:8000
      API_2_ADDR: ${APP_IP:?}:8000
      API_3_ADDR: ${APP_IP:?}:8001
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../nginx/snippets:/etc/nginx/snippets:ro
      # edge-http until the certificate exists, then edge-https (set in node.env).
      - ../../nginx/templates/${NGINX_SITE_TEMPLATE:-edge-http}.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      api-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [edge]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  api-1:
    extends: { file: common.yml, service: app-base }
    environment:
      INSTANCE_ID: api-1
      # Only Nginx (on the fixed Docker subnet below) may set X-Forwarded-For.
      FORWARDED_ALLOW_IPS: 172.28.0.0/24
    # Published on the PRIVATE IP only: Prometheus on the ops node scrapes /metrics.
    # Binding to the private IP (not 0.0.0.0) matters: Docker-published ports bypass ufw.
    ports: ["${PRIVATE_IP:?}:8000:8000"]
    networks: [edge]

  node-exporter:
    extends: { file: common.yml, service: node-exporter }

  # One-off: docker compose -f edge.yml --profile certbot run --rm certbot certonly ...
  certbot:
    image: certbot/certbot:v3.1.0
    profiles: ["certbot"]
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/lib/letsencrypt:/var/lib/letsencrypt
      - /var/www/certbot:/var/www/certbot

networks:
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24
