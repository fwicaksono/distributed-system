# PostgreSQL client authentication. First matching line wins.
# TYPE   DATABASE  USER  ADDRESS          METHOD
#
# scram-sha-256: salted challenge-response; the password never crosses the network.
# There is intentionally NO 0.0.0.0/0 line: even if a Security Group were opened by
# mistake, PostgreSQL itself refuses connections from outside private address space.

local    all       all                    trust          # unix socket inside the container only
host     all       all   127.0.0.1/32     scram-sha-256
host     all       all   10.0.0.0/8       scram-sha-256  # AWS VPC (10.20.0.0/16)
host     all       all   172.16.0.0/12    scram-sha-256  # Docker bridge networks
host     all       all   192.168.0.0/16   scram-sha-256  # Docker Desktop / custom networks
