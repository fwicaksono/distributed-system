# PostgreSQL 17 configuration for a small instance (2 vCPU / 2-4 GB RAM shared with Redis).
# Values marked (!) should be re-derived when the instance size changes.

# --- Connections -----------------------------------------------------------------------
listen_addresses = '*'           # container/host interface; access restricted by pg_hba.conf + SG
port = 5432
# Each connection is a separate backend PROCESS (~5-10 MB). Pool in the app instead of
# raising this. Budget: 3 APIs x 10 + 2 workers x 10 + exporters/admin ≈ 55.
max_connections = 100
superuser_reserved_connections = 3

# --- Memory (!) ------------------------------------------------------------------------
shared_buffers = 512MB           # ~25% of RAM dedicated to PostgreSQL
effective_cache_size = 1536MB    # planner hint: shared_buffers + OS page cache
work_mem = 8MB                   # per sort/hash node, per query — multiply by concurrency!
maintenance_work_mem = 128MB     # VACUUM, CREATE INDEX

# --- WAL / durability ------------------------------------------------------------------
wal_level = replica              # allows adding a streaming replica later
synchronous_commit = on          # COMMIT returns only after WAL is flushed: no lost commits
max_wal_size = 1GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9

# --- Planner (SSD / gp3 EBS) -----------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Safety timeouts -------------------------------------------------------------------
idle_in_transaction_session_timeout = '60s'  # kill sessions that BEGIN and wander off
lock_timeout = '0'                            # set per-session (migrations set 10s)

# --- Logging ---------------------------------------------------------------------------
log_min_duration_statement = 250  # log every query slower than 250 ms
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %q%u@%d app=%a '

# --- Statistics ------------------------------------------------------------------------
track_io_timing = on
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all

# --- Autovacuum (defaults are fine; stated explicitly for learning) ---------------------
autovacuum = on
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

timezone = 'UTC'
