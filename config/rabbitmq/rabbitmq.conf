# RabbitMQ 4.1 configuration (merged into the image's defaults via conf.d).
# Users come from RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS environment variables.

listeners.tcp.default = 5672
management.tcp.port = 15672
prometheus.tcp.port = 15692

# The built-in "guest" user may only connect from localhost (the default, stated explicitly).
loopback_users.guest = true

# --- Flow control (back-pressure) ------------------------------------------------------
# When memory use exceeds 40% of available RAM, RabbitMQ BLOCKS publishers until
# consumers catch up. Publishers then time out (API returns 503) instead of the broker
# crashing. This is intentional back-pressure, not a bug.
vm_memory_high_watermark.relative = 0.4
# Stop accepting messages when free disk drops below 1 GB (persistent messages need disk).
disk_free_limit.absolute = 1GB

# --- Consumers -------------------------------------------------------------------------
# If a consumer holds an unacked message longer than this, the channel is closed and the
# message requeued. Must exceed the longest task (30 s max) by a wide margin.
consumer_timeout = 900000

# --- Connections -----------------------------------------------------------------------
heartbeat = 30
channel_max = 128

# /metrics returns cluster-wide aggregates (cheap). Per-queue depth is scraped from
# /metrics/detailed?family=queue_coarse_metrics&family=queue_consumer_count (see monitoring/prometheus/prometheus.yml).
prometheus.return_per_object_metrics = false

log.console = true
log.console.level = info
