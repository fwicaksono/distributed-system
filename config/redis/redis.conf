# Redis 7.4 configuration — used as a CACHE and RATE-LIMIT store, not as a database.
# The password is passed on the command line from an environment variable
# (--requirepass), so this file contains no secrets and can be committed.

bind 0.0.0.0                 # inside the container; the SG / Docker network restricts access
protected-mode yes           # refuse remote connections if no password is set
port 6379
tcp-keepalive 60
timeout 0

# --- Memory ----------------------------------------------------------------------------
# Hard cap. Without it, Redis grows until the Linux OOM killer kills it (or PostgreSQL,
# which shares the data node!).
maxmemory 256mb
# Every key we write has a TTL; evict the least-recently-used among ALL keys when full.
# A cache that evicts is working as designed. A cache that refuses writes (noeviction)
# turns memory pressure into application errors.
maxmemory-policy allkeys-lru

# --- Persistence -----------------------------------------------------------------------
# Cache data is disposable: losing it on restart only causes temporary cache misses.
# Disabling persistence avoids fork() latency spikes and disk usage.
save ""
appendonly no

# --- Safety ----------------------------------------------------------------------------
# Disable commands that can wipe or block the whole instance from application clients.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
rename-command KEYS ""       # O(N): use SCAN instead

slowlog-log-slower-than 10000  # microseconds (10 ms)
slowlog-max-len 128
latency-monitor-threshold 100
